# Configuration YAML for axolotl fine-tuning for LLM models.
# We are using SFT with QLORA and try to fit this on a single GPU with 12 GB VRAM.
#
# The dataset is generated with ``generate_tain_data.py``.
base_model: google/gemma-4-E4B-it
trust_remote_code: true

processor_type: AutoProcessor
skip_prepare_dataset: true
remove_unused_columns: false
sample_packing: false

chat_template: tokenizer_default

load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_linear: true

datasets:
  - path: ./training_data_train.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    roles_to_train:
      - assistant

test_datasets:
  - path: ./training_data_eval.jsonl
    ds_type: json
    split: train
    type: chat_template
    field_messages: messages
    message_property_mappings:
      role: role
      content: content
    roles_to_train:
      - assistant

sequence_len: 512
micro_batch_size: 1
gradient_accumulation_steps: 16
num_epochs: 2

learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0

gradient_checkpointing: true
bf16: true
tf32: true

logging_steps: 10
evals_per_epoch: 1
saves_per_epoch: 1

output_dir: ./outputs/gemma4-e4b-qlora
